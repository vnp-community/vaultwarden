replicaCount: 3

image:
  repository: vaultwarden/server
  pullPolicy: IfNotPresent
  tag: "testing"

hpa:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

config:
  clusterMode: "true"
  redisEnabled: "true"
  redisUrl: "redis://redis-master:6379"
  # Set to Postgres database string
  databaseUrl: ""
  # Optional: For Read Replicas
  databaseReadUrl: ""
  databasePoolSize: "10"
  databaseReadPoolSize: "10"
  enableWebsocket: "true"
  shutdownTimeoutSeconds: "15"

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi
